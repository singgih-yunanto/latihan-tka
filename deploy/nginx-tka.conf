# Nginx config for the TKA practice app.
#
# The server is reached by IP address with no domain name, so TLS uses a
# self-signed certificate. Replace SERVER_IP below with the server's address,
# or use deploy/make-cert.sh which writes this file out with the right IP.

# Sign-in attempts per client address. The app throttles too, per username and
# per IP, but this stops a flood before it reaches Node. A whole class behind
# one school router shares an address, hence the generous burst.
limit_req_zone $binary_remote_addr zone=tka_login:10m rate=30r/m;

# HTTP exists only to redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name SERVER_IP;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name SERVER_IP;

    ssl_certificate     /etc/ssl/tka/tka.crt;
    ssl_certificate_key /etc/ssl/tka/tka.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    # Children work through illustrated questions; compression helps on slow
    # connections.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 8m;

    # Pages get their CSP and other security headers from the app (src/proxy.ts),
    # which needs a per-request nonce. These two cover what the proxy skips.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Next.js build assets are content-hashed, so they are safe to cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The sign-in page; its Server Action posts here as well.
    location = /masuk {
        limit_req zone=tka_login burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # REQUIRED. Next.js Server Actions compare the Origin header against
        # Host. Without these three lines, saving answers fails with
        # "Invalid Server Actions request" even though the page looks fine.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
